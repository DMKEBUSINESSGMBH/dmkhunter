name: Go Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Release Binary
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: "go.mod"
          binary_name: "dmkhunter"
          extra_files: LICENSE Readme.md
          ldflags: "-s -w -X main.version=${{ github.event.release.tag_name || github.ref_name }}"
          md5sum: TRUE
          sha256sum: TRUE